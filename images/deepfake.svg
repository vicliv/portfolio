<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Deepfake Detector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#0f2a30"/>
      <stop offset="1" stop-color="#02385c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23aeb3"/>
      <stop offset="1" stop-color="#2e6771"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#23aeb3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#23aeb3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="260" fill="url(#bg)"/>
  <rect width="720" height="260" fill="url(#glow)"/>

  <!-- node-link field (left, "real") -->
  <g stroke="url(#accent)" stroke-width="1.2" opacity="0.55">
    <line x1="70" y1="70" x2="150" y2="120"/>
    <line x1="150" y1="120" x2="110" y2="200"/>
    <line x1="150" y1="120" x2="240" y2="90"/>
    <line x1="240" y1="90" x2="300" y2="160"/>
    <line x1="110" y1="200" x2="220" y2="210"/>
    <line x1="220" y1="210" x2="300" y2="160"/>
  </g>
  <g fill="#23aeb3">
    <circle cx="70" cy="70" r="5"/>
    <circle cx="150" cy="120" r="6"/>
    <circle cx="110" cy="200" r="5"/>
    <circle cx="240" cy="90" r="5"/>
    <circle cx="300" cy="160" r="6"/>
    <circle cx="220" cy="210" r="5"/>
  </g>

  <!-- scanning magnifier over the boundary -->
  <g transform="translate(430 130)">
    <circle r="66" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle r="66" fill="#23aeb3" opacity="0.06"/>
    <line x1="46" y1="46" x2="92" y2="92" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <!-- "fake" heat speckle inside the lens -->
    <g fill="#e74c3c" opacity="0.85">
      <rect x="-30" y="-26" width="14" height="14" rx="3"/>
      <rect x="-6" y="2" width="20" height="20" rx="4"/>
      <rect x="14" y="-18" width="10" height="10" rx="2"/>
    </g>
    <g fill="#f1c40f" opacity="0.7">
      <rect x="-34" y="6" width="10" height="10" rx="2"/>
      <rect x="6" y="-30" width="8" height="8" rx="2"/>
    </g>
  </g>

  <text x="48" y="240" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Deepfake Detector</text>
</svg>
